name: Build RMX1901-Kernel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "sdm670-perf_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.22

    - name: Install dependencies
      run: |
        sudo timedatectl set-timezone Asia/Dhaka
        sudo apt-get update -y
        sudo apt install binutils make python3 libssl-dev build-essential bc bison flex zip unzip xz-utils mkbootimg cpio device-tree-compiler git git-lfs gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu curl -y
        
        # Download and extract ZyC Clang 16 from updated release link
        curl -L -O https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        mkdir clang
        tar -xf Clang-16.0.6-*.tar.gz -C clang
        rm -f Clang-16.0.6-*.tar.gz
        
        git clone https://github.com/ij-israfil/AnyKernel3 -b master --depth=1
        rm -rf AnyKernel3/.git AnyKernel3/.github

    - name: GetTime
      id: get_time
      run: echo "TIME=$(TZ=Asia/Dhaka date +%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Build Kernel
      id: build_kern
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export ARCH=arm64
        export SUBARCH=arm64

        # Disable LTO and use GNU Assembler for early boot stability on modern LLVM
        export LLVM=1
        export LLVM_IAS=0
        export LD=ld.lld
        export KBUILD_LTO_CLANG=0

        # Extra flags to suppress driver warnings during compilation
        EXTRA_ARGS="HOSTCFLAGS=-Wno-unused-command-line-argument KCFLAGS=-Wno-unused-command-line-argument"

        # 1st: defconfig
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang" $EXTRA_ARGS

        # Disable LTO inside generated .config just in case defconfig force-enables it
        scripts/config --file out/.config --disable LTO
        scripts/config --file out/.config --disable LTO_CLANG
        scripts/config --file out/.config --disable THINLTO
        scripts/config --file out/.config --enable LTO_NONE

        # Kernel version
        VERSION=$(make kernelversion)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

        # 2nd: full kernel build
        make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc) $EXTRA_ARGS

        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3
        
        # Package AnyKernel3 output as zip
        cd AnyKernel3
        zip -r9 "../RMX1901-Perf-Kernel-${VERSION}-${{ steps.get_time.outputs.TIME }}.zip" * -x .git README.md
        cd ..

    - name: Upload to Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: "v${{ steps.build_kern.outputs.VERSION }}-${{ steps.get_time.outputs.TIME }}"
        name: "RMX1901 Kernel ${{ steps.build_kern.outputs.VERSION }} (${{ steps.get_time.outputs.TIME }})"
        files: RMX1901-Perf-Kernel-*.zip
